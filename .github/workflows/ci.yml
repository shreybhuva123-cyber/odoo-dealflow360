name: DealFlow360 CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealflow360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Syntax & Lint Verification
        working-directory: ./backend
        run: npm run lint

      - name: Apply Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dealflow360?schema=public
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dealflow360?schema=public
        run: npm run seed

      - name: Run Pure Calculation Unit Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dealflow360?schema=public
          JWT_SECRET: dealflow360_ci_test_secret_key_at_least_32_chars
        run: npm run test:unit

      - name: Generate Test Coverage Report
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dealflow360?schema=public
          JWT_SECRET: dealflow360_ci_test_secret_key_at_least_32_chars
        run: npm run test:coverage

      - name: Run Full Integration & Security Suite (All 14 Suites)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dealflow360?schema=public
          JWT_SECRET: dealflow360_ci_test_secret_key_at_least_32_chars
        run: npm test

      - name: Build Verification
        working-directory: ./backend
        run: npm run build

      - name: Security Vulnerability Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true
